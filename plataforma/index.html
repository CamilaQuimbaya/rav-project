  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);

    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);

        resourceBlobs[blobUrls[uuid]] = blob;

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"0699781b-35ea-4bc6-8349-53a1a2d65da8\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet data-dc-atomics=\"\"><style>\n*{box-sizing:border-box}\nbody{margin:0;background:#F7F5EF;font-family:\"DejaVu Sans\",Verdana,Arial,sans-serif;color:#173653;-webkit-font-smoothing:antialiased}\na{color:#178C91;text-decoration:none}\na:hover{color:#116e72}\nbutton{font-family:inherit}\ninput,select,textarea{font-family:inherit}\n::placeholder{color:rgba(23,54,83,.45)}\n:focus-visible{outline:3px solid #178C91;outline-offset:2px;border-radius:4px}\n@keyframes rav-spin{to{transform:rotate(360deg)}}\n@keyframes rav-pulse{0%,100%{opacity:.35}50%{opacity:.85}}\n@keyframes rav-orbit{to{transform:rotate(360deg)}}\n@keyframes rav-draw{0%{stroke-dashoffset:620}55%{stroke-dashoffset:0}100%{stroke-dashoffset:-620}}\n@keyframes rav-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n@keyframes rav-bar{0%{width:6%}45%{width:62%}100%{width:96%}}\n<\u002Fstyle><\u002Fhelmet>\n\n<sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)\">\n  <div style=\"background:#173653;color:#fff;padding:56px 56px 40px;display:flex;flex-direction:column;justify-content:space-between;min-height:100vh;position:relative;overflow:hidden\">\n    <svg sc-camel-view-box=\"0 0 400 400\" fill=\"none\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"position:absolute;right:-70px;bottom:-50px;width:520px;pointer-events:none;opacity:.5;z-index:0\">\n      <path d=\"M30 372C30 188 150 62 342 34\" stroke=\"#178C91\" stroke-width=\"16\"><\u002Fpath>\n      <path d=\"M86 380C92 214 202 106 366 88\" stroke=\"#178C91\" stroke-width=\"9\" opacity=\".7\"><\u002Fpath>\n      <path d=\"M142 388C150 250 246 158 384 142\" stroke=\"#E5B653\" stroke-width=\"6\" opacity=\".8\"><\u002Fpath>\n      <circle cx=\"318\" cy=\"118\" r=\"54\" stroke=\"#178C91\" stroke-width=\"6\" opacity=\".45\"><\u002Fcircle>\n    <\u002Fsvg>\n    <img src=\"bf660850-3741-4b8d-9a2d-9eb13e172659\" alt=\"Rafael Argote Vega\" style=\"width:290px;max-width:100%;filter:brightness(0) invert(1);position:relative;z-index:2\">\n    <div style=\"display:flex;flex-direction:column;gap:18px;max-width:440px;position:relative;z-index:2\">\n      <div style=\"width:44px;height:3px;background:#E5B653\"><\u002Fdiv>\n      <div style=\"font-size:34px;line-height:1.15;font-weight:700\">Tradición que inspira.<br>Educación que avanza.<\u002Fdiv>\n      <div style=\"font-size:17px;line-height:1.55;color:rgba(255,255,255,.82)\">Tus clases, tus actividades y tu avance en un solo lugar. Y desde 6.º, el camino hacia lo que quieres estudiar.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:13px;letter-spacing:.14em;color:rgba(255,255,255,.55)\">CHIRIGUANÁ · CESAR<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;align-items:center;justify-content:center;padding:48px 40px\">\n    <div style=\"width:100%;max-width:420px;display:flex;flex-direction:column;gap:22px\">\n      <sc-if value=\"{{ isRecover }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:22px\">\n          <div>\n            <div style=\"font-size:28px;font-weight:700;line-height:1.15\">Recupera tu acceso<\u002Fdiv>\n            <div style=\"font-size:16px;line-height:1.5;color:rgba(23,54,83,.72);margin-top:8px\">Escribe tu correo institucional y te enviamos un enlace para crear una contraseña nueva.<\u002Fdiv>\n          <\u002Fdiv>\n          <label style=\"display:flex;flex-direction:column;gap:7px;font-size:14px;font-weight:700\">Correo institucional\n            <input value=\"sofia.martinez@rav.edu.co\" style=\"border:1px solid rgba(23,54,83,.22);border-radius:10px;padding:13px 14px;font-size:15px;color:#173653;background:#fff;font-weight:400\">\n          <\u002Flabel>\n          <button sc-camel-on-click=\"{{ enter }}\" style=\"border:0;background:#178C91;color:#fff;font-size:16px;font-weight:700;padding:14px;border-radius:10px;cursor:pointer\" style-hover=\"background:#116e72\">Enviar enlace<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ toLogin }}\" style=\"border:0;background:none;color:#178C91;font-size:14px;font-weight:700;cursor:pointer;padding:4px\">Volver a iniciar sesión<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isSignIn }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:22px\">\n          <div>\n            <div style=\"font-size:28px;font-weight:700;line-height:1.15\">Hola de nuevo<\u002Fdiv>\n            <div style=\"font-size:16px;line-height:1.5;color:rgba(23,54,83,.72);margin-top:8px\">Entra con tu cuenta institucional para continuar.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:9px\">\n            <div style=\"font-size:13px;font-weight:700;letter-spacing:.06em;color:rgba(23,54,83,.72)\">ENTRAR COMO<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:9px\">\n              <sc-for list=\"{{ roles }}\" as=\"r\" hint-placeholder-count=\"4\">\n                <button sc-camel-on-click=\"{{ r.pick }}\" style=\"text-align:left;cursor:pointer;border:1px solid {{ r.border }};background:{{ r.bg }};color:{{ r.fg }};border-radius:10px;padding:11px 12px;font-size:14px;font-weight:700\">{{ r.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <label style=\"display:flex;flex-direction:column;gap:7px;font-size:14px;font-weight:700\">Usuario\n            <input value=\"{{ loginUser }}\" style=\"border:1px solid rgba(23,54,83,.22);border-radius:10px;padding:13px 14px;font-size:15px;color:#173653;background:#fff;font-weight:400\">\n          <\u002Fla 0;padding:13px 20px;border-radius:10px;cursor:pointer;margin-top:14px;position:relative;z-index:2\">Continuar el test →<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"text-align:center\">\n      <div style=\"font-size:56px;font-weight:700;color:#E5B653;line-height:1\">60%<\u002Fdiv>\n      <div style=\"font-size:14px;color:rgba(255,255,255,.8)\">de tu perfil completo<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;gap:16px;align-items:flex-start;background:#fff;border:1px solid rgba(23,54,83,.10);border-radius:14px;padding:20px 22px\">\n    <svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#178C91\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"width:24px;height:24px;flex:none;margin-top:2px\"><path d=\"M12 2.6 4.4 6v6c0 4.6 3.2 8.4 7.6 9.4 4.4-1 7.6-4.8 7.6-9.4V6z\"><\u002Fpath><path d=\"M9.4 12.2l1.9 1.9 3.9-4.1\"><\u002Fpath><\u002Fsvg>\n    <div style=\"display:flex;flex-direction:column;gap:6px\">\n      <div style=\"font-size:16px;font-weight:700\">Esto orienta, no decide<\u002Fdiv>\n      <div style=\"font-size:14.5px;line-height:1.55;color:rgba(23,54,83,.78);max-width:760px\">En 6.º y 7.º el objetivo es explorar: nada de lo que respondas te compromete. Desde 10.º el informe se usa para preparar tu decisión con la orientadora. <strong>Tu acudiente ve el avance y el informe general; tus respuestas una por una solo las ve la orientadora.<\u002Fstrong><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px\">\n    <sc-for list=\"{{ vocsteps }}\" as=\"v\" hint-placeholder-count=\"4\">\n      <div style=\"background:#fff;border:1px solid rgba(23,54,83,.10);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:9px\">\n        <div style=\"display:flex;align-items:center;gap:10px\">\n          <div style=\"width:28px;height:28px;border-radius:50%;background:{{ v.tone }};color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center\">{{ v.num }}<\u002Fdiv>\n          <div style=\"font-size:16px;font-weight:700\">{{ v.n }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13.5px;color:rgba(23,54,83,.72)\">{{ v.d }}<\u002Fdiv>\n        <div style=\"height:6px;border-radius:6px;background:rgba(23,54,83,.10)\"><div style=\"height:6px;border-radius:6px;background:{{ v.tone }};width:{{ v.bar }}\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"font-size:13px;font-weight:700;color:rgba(23,54,83,.78)\">{{ v.state }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start\">\n    <div style=\"background:#fff;border:1px solid rgba(23,54,83,.10);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n      <div style=\"font-size:19px;font-weight:700\">Áreas afines a ti<\u002Fdiv>\n      <sc-for list=\"{{ areas }}\" as=\"a\" hint-placeholder-count=\"5\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <div style=\"display:flex;justify-content:space-between;font-size:14.5px\"><span>{{ a.n }}<\u002Fspan><span style=\"font-weight:700\">{{ a.pct }}<\u002Fspan><\u002Fdiv>\n          <div style=\"height:8px;border-radius:6px;background:rgba(23,54,83,.10)\"><div style=\"height:8px;border-radius:6px;background:#178C91;width:{{ a.pct }}\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"background:#F7F5EF;border-radius:12px;padding:16px;font-size:14px;line-height:1.55;color:rgba(23,54,83,.8)\">El informe combina tus respuestas con tus notas de los últimos tres periodos. Puedes repetirlo cada semestre.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <div style=\"background:#fff;border:1px solid rgba(23,54,83,.10);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-size:19px;font-weight:700\">Rutas de carrera sugeridas<\u002Fdiv>\n        <sc-for list=\"{{ carreras }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <div style=\"border:1px solid rgba(23,54,83,.10);border-radius:12px;padding:16px 18px;display:flex;gap:14px;align-items:center\">\n            <div style=\"flex:1\">\n              <div style=\"display:flex;align-items:baseline;gap:10px\"><span style=\"font-size:16px;font-weight:700\">{{ c.n }}<\u002Fspan><span style=\"font-size:12.5px;font-weight:700;color:#116e72;background:#E7F2F2;border-radius:20px;padding:3px 10px\">{{ c.m }}<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:13.5px;line-height:1.5;color:rgba(23,54,83,.72);margin-top:5px\">{{ c.d }}<\u002Fdiv>\n            <\u002Fdiv>\n            <button style=\"border:1px solid rgba(23,54,83,.16);background:#fff;font-size:13.5px;font-weight:700;color:#173653;border-radius:9px;padding:9px 14px;cursor:pointer;flex:none\">Ver ruta<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid rgba(23,54,83,.10);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:19px;font-weight:700\">Dónde podrías estudiar<\u002Fdiv>\n        <sc-for list=\"{{ unis }}\" as=\"u\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(23,54,83,.08)\">\n            <div style=\"width:40px;height:40px;border-radius:10px;background:#FBF1DC;display:flex;align-items:center;justify-content:center;flex:none\">\n              <svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#9a7420\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:19px;height:19px\"><path d=\"M3 9.6 12 5l9 4.6-9 4.6zM7 12v4.6c0 1.4 2.2 2.4 5 2.4s5-1 5-2.4V12\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font-size:15px;font-weight:700\">{{ u.n }}<\u002Fdiv>\n              <div style=\"font-size:13px;color:rgba(23,54,83,.72);margin-top:2px\">{{ u.c }} · {{ u.p }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#E7F2F2;border:1px solid rgba(23,140,145,.28);border-radius:14px;padding:26px;display:flex;gap:20px;align-items:center;flex-wrap:wrap\">\n    <div style=\"flex:1;min-width:280px\">\n      <div style=\"font-size:19px;font-weight:700\">Habla con tu orientadora<\u002Fdiv>\n      <div style=\"font-size:14.5px;line-height:1.55;color:rgba(23,54,83,.8);margin-top:5px\">Camila Bolaño acompaña a los grados 6.º a 11.º. Puedes agendar 20 minutos para revisar tu informe.<\u002Fdiv>\n    <\u002Fdiv>\n    <button style=\"border:0;background:#178C91;color:#fff;font-size:15px;font-weight:700;border-radius:10px;padding:13px 22px;cursor:pointer\">Agendar orientación<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ testAbierto }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:22px;max-width:760px;margin:0 auto;width:100%\" data-screen-label=\"Test vocacional\">\n  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px\">\n    <div style=\"font-size:13px;font-weight:700;letter-spacing:.08em;color:rgba(23,54,83,.6)\">BLOQUE 3 · VALORES<\u002Fdiv>\n    <button sc-camel-on-click=\"{{ qSalir }}\" style=\"border:1px solid rgba(23,54,83,.16);background:#fff;color:#173653;font-size:13.5px;font-weight:700;border-radius:9px;padding:9px 14px;cursor:pointer\">Guardar y salir<\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:8px\">\n    <div style=\"display:flex;justify-content:space-between;font-size:13.5px;color:rgba(23,54,83,.72)\"><span>Pregunta {{ qNum }} de {{ qTotal }}<\u002Fspan><span>Puedes salir cuando quieras: se guarda solo<\u002Fspan><\u002Fdiv>\n    <div style=\"height:8px;border-radius:6px;background:rgba(23,54,83,.10)\"><div style=\"height:8px;border-radius:6px;background:#178C91;width:{{ qBar }}\"><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background:#fff;border:1px solid rgba(23,54,83,.10);border-radius:16px;padding:34px 34px 28px;display:flex;flex-direction:column;gap:20px\">\n    <div style=\"font-size:26px;font-weight:700;line-height:1.25;text-wrap:pretty\">{{ qTexto }}<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:11px\">\n      <sc-for list=\"{{ qOpciones }}\" as=\"o\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ o.pick }}\" style=\"display:flex;align-items:center;gap:15px;text-align:left;cursor:pointer;background:{{ o.bg }};border:1.5px solid {{ o.border }};border-radius:12px;padding:17px 19px;min-height:60px\" style-hover=\"border-color:#178C91\">\n          <span style=\"width:26px;height:26px;border-radius:50%;border:2px solid {{ o.dot }};display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:rgba(23,54,83,.7);flex:none\">{{ o.letra }}<\u002Fspan>\n          <span style=\"font-size:16.5px;line-height:1.4;color:#173653\">{{ o.label }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"font-size:13.5px;color:rgba(23,54,83,.65);line-height:1.5\">No hay respuestas correctas. Responde lo que de verdad sientes: el informe solo es útil si es honesto.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;gap:12px;align-items:center\">\n    <button sc-camel-on-click=\"{{ qAtras }}\" style=\"border:1px solid rgba(23,54,83,.18);background:#fff;color:#173653;font-size:15px;font-weight:700;border-radius:10px;padding:13px 20px;cursor:pointer\">← Atrás<\u002Fbutton>\n    <div style=\"flex:1\"><\u002Fdiv>\n    <sc-if value=\"{{ qPuedeSeguir }}\" hint-placeholder-val=\"{{ false }}\">\n      <button sc-camel-on-click=\"{{ qSiguiente }}\" style=\"border:0;background:#178C91;color:#fff;font-size:15px;font-weight:700;border-radius:10px;padding:13px 24px;cursor:pointer\">{{ qSiguienteLabel }} →<\u002Fbutton>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ qFalta }}\" hint-placeholder-val=\"{{ true }}\">\n      <span style=\"font-size:13.5px;color:rgba(23,54,83,.6)\">Elige una opción para continuar<\u002Fspan>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ sNoti }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:20px\">\n  <div style=\"display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px\">\n    <div>\n      <div style=\"font-size:30px;font-weight:700\">Notificaciones<\u002Fdiv>\n      <div style=\"font-size:16px;color:rgba(23,54,83,.72);margin-top:4px\">Lo que pasó mientras no estabas.<\u002Fdiv>\n    <\u002Fdiv>\n    <button style=\"border:1px solid rgba(23,54,83,.16);background:#fff;font-size:14px;font-weight:700;color:#173653;border-radius:9px;padding:10px 16px;cursor:pointer\">Marcar todo como leído<\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"background:#fff;border:1px solid rgba(23,54,83,.10);border-radius:14px;overflow:hidden\">\n    <sc-for list=\"{{ notis }}\" as=\"n\" hint-placeholder-count=\"5\">\n      <div style=\"display:flex;gap:16px;align-items:center;padding:18px 22px;border-bottom:1px solid rgba(23,54,83,.08)\">\n        <div style=\"width:10px;height:10px;border-radius:50%;background:{{ n.tone }};flex:none\"><\u002Fdiv>\n        <div style=\"flex:1;min-width:0\">\n          <div style=\"font-size:15.5px;font-weight:700\">{{ n.t }}<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:rgba(23,54,83,.72);margin-top:2px\">{{ n.d }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;color:rgba(23,54,83,.6)\">{{ n.w }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\ });\n    };\n    v.qAtras = () => { if (qi > 0) this.set({ q: qi - 1, answer: null }); else this.set({ view: \"vocacional\" }); };\n    v.qSalir = () => this.set({ view: \"vocacional\" });\n    v.abrirTest = () => this.set({ view: \"test\", q: 0, answer: null });\n    v.qFalta = s.answer === null;\n\n    v.offline = s.offline;\n    v.toggleOffline = () => this.set({ offline: !s.offline });\n    v.big = s.big;\n    v.toggleBig = () => this.set({ big: !s.big });\n    v.fsBase = s.big ? \"18px\" : \"16px\";\n    v.devices = [[\"movil\",\"Celular\"],[\"tablet\",\"Tablet\"]].map(([id, label]) => ({\n      id, label, bg: s.device === id ? \"#fff\" : \"transparent\", fg: s.device === id ? \"#173653\" : \"rgba(255,255,255,.85)\",\n      border: s.device === id ? \"#fff\" : \"rgba(255,255,255,.3)\",\n      go: () => this.set({ device: id })\n    }));\n    v.esMovil = s.device === \"movil\";\n    v.esTablet = s.device === \"tablet\";\n\n    v.grades = GRADES;\n    v.res = RES;\n    v.threads = THREADS.map((t, i) => Object.assign({}, t, {\n      bg: s.thread === i ? \"#E7F2F2\" : \"transparent\",\n      dot: t.unread ? \"#E5B653\" : \"transparent\",\n      open: () => this.set({ thread: i })\n    }));\n    v.thread = THREADS[s.thread];\n    v.msgs = MSGS.map((m, i) => Object.assign({}, m, {\n      key: \"m\" + i, align: m.me ? \"flex-end\" : \"flex-start\",\n      bg: m.me ? \"#173653\" : \"#fff\", fg: m.me ? \"#fff\" : \"#173653\",\n      border: m.me ? \"#173653\" : \"rgba(23,54,83,.12)\",\n      meta: m.me ? \"rgba(255,255,255,.7)\" : \"rgba(23,54,83,.6)\"\n    }));\n    v.notis = NOTIS;\n    v.areas = AREAS.map(a => ({ n: a.n, pct: a.p + \"%\", p: a.p }));\n    v.carreras = CARRERAS;\n    v.unis = UNIS;\n    v.vocsteps = VOCSTEPS.map((x, i) => Object.assign({}, x, {\n      key: \"v\" + i, num: String(i + 1), bar: x.pct + \"%\",\n      state: x.pct === 100 ? \"Completado\" : (x.pct > 0 ? \"En curso\" : \"Pendiente\"),\n      tone: x.pct === 100 ? \"#178C91\" : (x.pct > 0 ? \"#E5B653\" : \"rgba(23,54,83,.3)\")\n    }));\n    Object.assign(v, {\n      pInicio: f(\"parent\",\"inicio\"), pFeed: f(\"parent\",\"feedback\"), pAsis: f(\"parent\",\"asistencia\"),\n      pBol: f(\"parent\",\"boletin\"), pDoc: f(\"parent\",\"docentes\"), pCitas: f(\"parent\",\"citas\"), pAlert: f(\"parent\",\"alertas\"),\n      pConf: f(\"parent\",\"config\"),\n      tInicio: f(\"teacher\",\"inicio\"), tClases: f(\"teacher\",\"clases\"), tCalif: f(\"teacher\",\"calificar\"),\n      tAsis: f(\"teacher\",\"asistenciaD\"), tMsg: f(\"teacher\",\"mensajes\"), tRec: f(\"teacher\",\"recursos\"),\n      cInicio: f(\"coord\",\"inicio\"), cGrados: f(\"coord\",\"grados\"), cEquipo: f(\"coord\",\"equipo\"),\n      cRep: f(\"coord\",\"reportes\"), cAlert: f(\"coord\",\"alertasC\")\n    });\n    v.children = CHILDREN.map((c, i) => Object.assign({}, c, {\n      key: \"k\" + i,\n      bg: s.child === i ? \"#173653\" : \"#fff\", fg: s.child === i ? \"#fff\" : \"#173653\",\n      sub: s.child === i ? \"rgba(255,255,255,.75)\" : \"rgba(23,54,83,.7)\",\n      border: s.child === i ? \"#173653\" : \"rgba(23,54,83,.14)\",\n      pick: () => this.set({ child: i })\n    }));\n    v.kid = CHILDREN[s.child];\n    v.feedback = FEEDBACK; v.asis = ASIS; v.dir = DIRECTORIO; v.citas = CITAS; v.alertas = ALERTAS;\n    v.clasesHoy = CLASES_HOY; v.porCalificar = POR_CALIFICAR; v.estudiantes = ESTUDIANTES;\n    v.grados = GRADOS; v.equipo = EQUIPO;\n    return v;\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
